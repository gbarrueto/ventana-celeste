<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Guía — dual-telescope</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; overflow:hidden; background:#000; color:#e8ecf5;
                 font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
    /* Posición, tamaño y rotación las fija acomodarVista() en JS: al rotar 90° o
       270° hay que intercambiar ancho y alto, y eso no se expresa con inset:0.
       El resto de la UI está en src/ui.css. */
    #stel-canvas { display:block; background:#000; }
  </style>
</head>
<body>
  <canvas id="stel-canvas"></canvas>
  <div class="crosshair"></div>
  <div id="status">iniciando…</div>
  <script type="module">
    import { startSky } from '/src/sky.js';
    startSky({
      role: 'guide',
      canvas: document.getElementById('stel-canvas'),
      statusEl: document.getElementById('status'),
    }).catch((e) => { document.getElementById('status').textContent = 'error: ' + e.message; });
  </script>
</body>
</html>
