<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ocular — dual-telescope</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; overflow:hidden; background:#000; color:#e8ecf5;
                 font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
    #stel-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #status { position:fixed; left:8px; bottom:8px; z-index:10; padding:7px 10px;
              background:rgba(6,8,15,.82); border:1px solid rgba(255,255,255,.12);
              border-radius:8px; }
    .crosshair { position:fixed; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px;
      z-index:5; pointer-events:none; border:1px solid rgba(255,122,13,.8); border-radius:50%; }
    .crosshair::before, .crosshair::after { content:''; position:absolute; background:rgba(255,122,13,.8); }
    .crosshair::before { left:50%; top:-8px; width:1px; height:40px; margin-left:-.5px; }
    .crosshair::after { top:50%; left:-8px; height:1px; width:40px; margin-top:-.5px; }
  </style>
  <script type="module" crossorigin src="/assets/ocular-DkeylAQM.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/sky-BYIJtxlM.js">
</head>
<body>
  <canvas id="stel-canvas"></canvas>
  <div class="crosshair"></div>
  <div id="status">iniciando…</div>
</body>
</html>
